name: Deploy (Development)

# End-to-end deployment of Phoenix AI to the Development environment.
#
# Authenticates with GitHub OIDC (federated credentials) — NO stored Azure client
# secrets. The pipeline validates and provisions infrastructure, builds the app,
# runs a safe database migration, remotely builds an immutable image in ACR,
# rolls it out to Azure Container Apps, and verifies health and critical journeys.
#
# GitHub Environment: Development. Demo and Development are reviewer-free for
# rapid prototyping; Demo remains manual-dispatch only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_infrastructure:
        description: 'Run full Bicep reconciliation (requires reviewed PostgreSQL version alignment).'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AZURE_LOCATION: eastus2
  RESOURCE_GROUP: rg-phoenixai-bfgs-demo
  DEPLOY_NAME: phoenixai-dev-${{ github.run_number }}
  IMAGE_TAG: ${{ github.sha }}
  FULL_INFRASTRUCTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_infrastructure || false }}

jobs:
  deploy:
    name: Provision, deploy & promote
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Authenticate using OIDC (no client secret).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Validate Bicep.
      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep

      # 3. Run Azure what-if only for an explicitly requested infrastructure reconciliation.
      - name: What-if (subscription scope)
        if: env.FULL_INFRASTRUCTURE == 'true'
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub what-if \
            --name "${DEPLOY_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters containerImageTag="${IMAGE_TAG}" authMode=demo

      # 4a. Resolve the existing runtime for the default application-only rollout.
      - name: Resolve existing Container Apps resources
        if: env.FULL_INFRASTRUCTURE != 'true'
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          ACR=$(az acr list --resource-group "${RESOURCE_GROUP}" --query "[?starts_with(name, 'acrphx')].name | [0]" -o tsv)
          APP=$(az containerapp list --resource-group "${RESOURCE_GROUP}" --query "[?starts_with(name, 'ca-phoenixai-')].name | [0]" -o tsv)
          if [ -z "${ACR}" ] || [ -z "${APP}" ]; then
            echo "Existing Phoenix AI ACR or Container App was not found in ${RESOURCE_GROUP}." >&2
            exit 1
          fi
          ACR_LOGIN_SERVER=$(az acr show --resource-group "${RESOURCE_GROUP}" --name "${ACR}" --query loginServer -o tsv)
          APP_FQDN=$(az containerapp show --resource-group "${RESOURCE_GROUP}" --name "${APP}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "RG=${RESOURCE_GROUP}" >> "$GITHUB_ENV"
          echo "ACR=${ACR}" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "APP=${APP}" >> "$GITHUB_ENV"
          echo "APP_URL=https://${APP_FQDN}" >> "$GITHUB_ENV"

      # 4b. Bootstrap dependencies only for an explicit full-infrastructure run.
      - name: Bootstrap infrastructure
        if: env.FULL_INFRASTRUCTURE == 'true'
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --name "${DEPLOY_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters deployContainerApp=false containerImageTag="${IMAGE_TAG}" authMode=demo
          RG=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.resourceGroupName.value -o tsv)
          ACR=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.containerRegistryName.value -o tsv)
          echo "RG=${RG}" >> "$GITHUB_ENV"
          echo "ACR=${ACR}" >> "$GITHUB_ENV"

      # 5. Build in Azure because no local Docker engine is required.
      - name: Build immutable image in ACR
        run: az acr build --registry "${ACR}" --image "phoenixai:${IMAGE_TAG}" --file Dockerfile nextjs_space

      # 6a. Update only the existing Container App revision (default path).
      - name: Deploy application-only Container App revision
        if: env.FULL_INFRASTRUCTURE != 'true'
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/phoenixai:${IMAGE_TAG}"
          az containerapp update \
            --resource-group "${RG}" \
            --name "${APP}" \
            --image "${IMAGE}" \
            --output none
          DEPLOYED_IMAGE=$(az containerapp show --resource-group "${RG}" --name "${APP}" --query properties.template.containers[0].image -o tsv)
          if [ "${DEPLOYED_IMAGE}" != "${IMAGE}" ]; then
            echo "Container App image mismatch: expected ${IMAGE}, got ${DEPLOYED_IMAGE}." >&2
            exit 1
          fi

      # 6b. Create or update all declared resources only when explicitly requested.
      - name: Deploy Container App revision
        if: env.FULL_INFRASTRUCTURE == 'true'
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --name "${DEPLOY_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters deployContainerApp=true containerImageTag="${IMAGE_TAG}" authMode=demo
          APP=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.containerAppName.value -o tsv)
          APP_URL=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.containerAppUrl.value -o tsv)
          echo "APP=${APP}" >> "$GITHUB_ENV"
          echo "APP_URL=${APP_URL}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies (lock file)
        working-directory: nextjs_space
        run: npm ci --legacy-peer-deps

      # 7. Run database migration safely (non-destructive; skipped if no DB configured).
      - name: Run database migration (safe)
        working-directory: nextjs_space
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL not configured for this environment — skipping migration (parity demo uses seeded/mock data)."
            exit 0
          fi
          npm run db:readiness
          # migrate deploy only applies committed, pending migrations — never resets.
          npm run db:migrate:deploy
          npm run db:migrate:status

      # 8. Verify the active Container App revision.
      - name: Health check
        run: |
          URL="${APP_URL}/api/health/live"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || true)
            if [ "${code}" = "200" ]; then echo "Container App is healthy."; exit 0; fi
            echo "Attempt ${i}: HTTP ${code} — retrying in 10s"; sleep 10
          done
          echo "Container App health check failed." >&2
          exit 1

      - name: Install Playwright browser (Chromium)
        working-directory: nextjs_space
        run: npx playwright install --with-deps chromium

      # 9. Run smoke tests against the deployed revision.
      - name: Smoke tests
        working-directory: nextjs_space
        run: PLAYWRIGHT_BASE_URL="${APP_URL}" npm run test:smoke

      # 10. Run critical HCP + community user journeys.
      - name: Critical journeys
        working-directory: nextjs_space
        run: PLAYWRIGHT_BASE_URL="${APP_URL}" npm run test:journeys
