name: Deploy (Development)

# End-to-end deployment of Phoenix AI to the Development environment.
#
# Authenticates with GitHub OIDC (federated credentials) — NO stored Azure client
# secrets. The pipeline validates and provisions infrastructure, builds the app,
# runs a safe (non-destructive) database migration, deploys to an App Service
# STAGING slot, verifies health, runs smoke + critical user-journey tests against
# staging, and only then swaps staging into production.
#
# GitHub Environment: Development (add reviewers/branch rules in repo settings as
# desired; the Demo pipeline is the approval-gated one).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AZURE_LOCATION: eastus2
  DEPLOY_NAME: phoenixai-dev-${{ github.run_number }}
  # Standard tier so the App Service plan supports the staging deployment slot.
  PLAN_SKU_NAME: S1
  PLAN_SKU_TIER: Standard

jobs:
  deploy:
    name: Provision, deploy & promote
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Authenticate using OIDC (no client secret).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Validate Bicep.
      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep

      # 3. Run Azure what-if (read-only preview).
      - name: What-if (subscription scope)
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub what-if \
            --name "${DEPLOY_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters appServicePlanSkuName="${PLAN_SKU_NAME}" appServicePlanSkuTier="${PLAN_SKU_TIER}" authMode=demo

      # 4. Deploy infrastructure and capture outputs.
      - name: Deploy infrastructure
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --name "${DEPLOY_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters appServicePlanSkuName="${PLAN_SKU_NAME}" appServicePlanSkuTier="${PLAN_SKU_TIER}" authMode=demo
          RG=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.resourceGroupName.value -o tsv)
          APP=$(az deployment sub show --name "${DEPLOY_NAME}" --query properties.outputs.appServiceName.value -o tsv)
          echo "RG=${RG}" >> "$GITHUB_ENV"
          echo "APP=${APP}" >> "$GITHUB_ENV"
          echo "STAGING_URL=https://${APP}-staging.azurewebsites.net" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies (lock file)
        working-directory: nextjs_space
        run: npm ci --legacy-peer-deps

      # 5. Build the application (standalone) and package the App Service bundle.
      - name: Build application (standalone)
        working-directory: nextjs_space
        env:
          NEXT_OUTPUT_MODE: standalone
        run: |
          export NEXTAUTH_URL="https://${APP}.azurewebsites.net"
          npm run db:generate
          npm run build

      - name: Package deployment bundle
        working-directory: nextjs_space
        run: |
          set -euo pipefail
          rm -rf deploy && mkdir deploy
          # Standalone root holds node_modules + traced files + the app subdir.
          cp -r .next/standalone/. deploy/
          # Flatten the app subdir to the bundle root so `node server.js` runs at wwwroot.
          cp -r deploy/nextjs_space/. deploy/
          rm -rf deploy/nextjs_space
          # Static assets are not included in the standalone output.
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          # Public assets.
          if [ -d public ]; then cp -r public deploy/public; fi
          (cd deploy && zip -qr ../deploy.zip .)

      # 6. Run database migration safely (non-destructive; skipped if no DB configured).
      - name: Run database migration (safe)
        working-directory: nextjs_space
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL not configured for this environment — skipping migration (parity demo uses seeded/mock data)."
            exit 0
          fi
          npm run db:readiness
          # migrate deploy only applies committed, pending migrations — never resets.
          npm run db:migrate:deploy
          npm run db:migrate:status

      # 7. Deploy to the App Service STAGING slot.
      - name: Ensure staging slot exists
        run: az webapp deployment slot create -g "${RG}" -n "${APP}" --slot staging 2>/dev/null || echo "staging slot already present."

      - name: Deploy to staging slot
        run: |
          az webapp deploy \
            --resource-group "${RG}" \
            --name "${APP}" \
            --slot staging \
            --type zip \
            --src-path nextjs_space/deploy.zip \
            --async false

      # 8. Run health check against the staging slot.
      - name: Health check (staging)
        run: |
          URL="${STAGING_URL}/api/health/live"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || true)
            if [ "${code}" = "200" ]; then echo "Staging is healthy."; exit 0; fi
            echo "Attempt ${i}: HTTP ${code} — retrying in 10s"; sleep 10
          done
          echo "Staging health check failed." >&2
          exit 1

      - name: Install Playwright browser (Chromium)
        working-directory: nextjs_space
        run: npx playwright install --with-deps chromium

      # 9. Run smoke tests against staging.
      - name: Smoke tests (staging)
        working-directory: nextjs_space
        run: PLAYWRIGHT_BASE_URL="${STAGING_URL}" npm run test:smoke

      # 10. Run critical HCP + community user journeys against staging.
      - name: Critical journeys (staging)
        working-directory: nextjs_space
        run: PLAYWRIGHT_BASE_URL="${STAGING_URL}" npm run test:journeys

      # 11. Promote — swap staging into production only after all tests passed.
      - name: Swap staging into production
        run: az webapp deployment slot swap -g "${RG}" -n "${APP}" --slot staging --target-slot production
