name: Database migrate (deploy)

# Applies pending Prisma migrations to Azure Database for PostgreSQL Flexible Server
# as a CONTROLLED, MANUAL step (workflow_dispatch). It runs `prisma migrate deploy`,
# which only applies already-committed, pending migrations and NEVER resets or drops
# the database - so it is safe to run against production.
#
# Prerequisites:
#   - Repository/environment secret DATABASE_URL (with sslmode=require).
#   - A GitHub Environment named "production" (optionally with required reviewers) to
#     gate the run behind an approval.

on:
  workflow_dispatch:

permissions: write-all

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: nextjs_space
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is not set for the 'production' environment." >&2
            exit 1
          fi

      - name: Database readiness
        run: npm run db:readiness

      - name: Apply pending migrations (non-destructive)
        run: npm run db:migrate:deploy

      - name: Migration status
        run: npm run db:migrate:status
