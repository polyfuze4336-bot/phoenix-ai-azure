name: Infrastructure

# Provisions the Phoenix AI Azure infrastructure from infra/ using Bicep.
#
# Authenticates to Azure with GitHub OIDC (federated credentials) — NO stored
# Azure client secrets. Pull requests that touch infra/ run lint + build +
# what-if (all read-only). Actual deployment runs only on manual dispatch and is
# scoped to the selected reviewer-free GitHub Environment (Development or Demo)
# for rapid prototyping.

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target GitHub Environment to deploy.'
        type: choice
        options:
          - Development
          - Demo
        default: Development
      deploy:
        description: 'Run the deployment (subscription-scoped) after what-if.'
        type: boolean
        default: false

# OIDC token + repo read. No client secrets are used anywhere in this workflow.
permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: eastus2
  TEMPLATE: infra/main.bicep
  PARAMETERS: infra/main.bicepparam

jobs:
  validate:
    name: Lint, build & what-if
    runs-on: ubuntu-latest
    # PRs validate against Development; manual runs use the chosen environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bicep lint
        run: az bicep build --file ${{ env.TEMPLATE }} --stdout > /dev/null

      - name: Bicep build (compile to ARM)
        run: az bicep build --file ${{ env.TEMPLATE }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (subscription scope)
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub what-if \
            --name phoenixai-infra-${{ github.run_number }} \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file ${{ env.TEMPLATE }} \
            --parameters ${{ env.PARAMETERS }}

  deploy:
    name: Deploy infrastructure
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (subscription scope)
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --name phoenixai-infra-${{ github.run_number }} \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file ${{ env.TEMPLATE }} \
            --parameters ${{ env.PARAMETERS }} \
            --parameters deployContainerApp=false
