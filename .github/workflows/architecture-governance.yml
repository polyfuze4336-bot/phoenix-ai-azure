name: Architecture Governance

# Enforces the architecture-first change policy for Phoenix AI.
#
#   1. docs-sync gate: if a pull request changes architecture-impacting paths but does NOT
#      update docs/architecture/**, the check fails with guidance.
#   2. Mermaid validation: every docs/architecture/**/*.mmd must parse.
#   3. Drift check: scripts/validate-architecture confirms code and docs agree.
#
# See docs/architecture/current-architecture.md and the policy in
# .github/copilot-instructions.md / AGENTS.md.

on:
  pull_request:
    branches: [main, 'migration/**']
  push:
    branches: [main, 'migration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-sync:
    name: Architecture docs-sync gate
    runs-on: ubuntu-latest
    # Only meaningful on pull requests (needs a base to diff against).
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for architecture-impacting changes without doc updates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Diffing $BASE_SHA...$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # Architecture-impacting paths. Note: lib/db.ts is a FILE (not lib/db/**).
          IMPACT_REGEX='^(nextjs_space/app/api/|nextjs_space/lib/ai/|nextjs_space/lib/storage/|nextjs_space/lib/auth/|nextjs_space/lib/db\.ts|nextjs_space/lib/config/|nextjs_space/prisma/|infra/|\.github/workflows/|nextjs_space/middleware\.|nextjs_space/next\.config\.|nextjs_space/package\.json)'
          DOC_REGEX='^docs/architecture/'

          IMPACT_HITS=$(echo "$CHANGED" | grep -E "$IMPACT_REGEX" || true)
          DOC_HITS=$(echo "$CHANGED" | grep -E "$DOC_REGEX" || true)

          if [ -n "$IMPACT_HITS" ] && [ -z "$DOC_HITS" ]; then
            echo "::error::Architecture-impacting files changed but no docs/architecture/** files were updated."
            echo "Impacting files:"
            echo "$IMPACT_HITS"
            echo ""
            echo "Update the AS-IS docs in the SAME PR: current-architecture.md, the relevant"
            echo "diagrams/*.mmd, the inventories, azure-resource-map.md, bump ARCHITECTURE_VERSION,"
            echo "add an ARCHITECTURE_CHANGELOG.md entry, and a changes/CHANGE-*.md record."
            echo "If this PR genuinely does not change architecture, explain why in the PR description."
            exit 1
          fi

          echo "docs-sync gate passed."

  mermaid:
    name: Validate Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@11

      - name: Validate every .mmd parses
        run: |
          set -euo pipefail
          mkdir -p /tmp/mmd-out
          shopt -s nullglob
          FILES=(docs/architecture/**/*.mmd docs/architecture/*.mmd)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No .mmd files found."
            exit 0
          fi
          for f in "${FILES[@]}"; do
            echo "Validating $f"
            mmdc --input "$f" --output "/tmp/mmd-out/$(basename "$f").svg"
          done
          echo "All Mermaid diagrams valid."

      - name: Upload rendered diagrams (non-authoritative artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams-svg
          path: /tmp/mmd-out/*.svg
          if-no-files-found: ignore

  drift:
    name: Architecture drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run drift validation
        run: node nextjs_space/scripts/validate-architecture.mjs
